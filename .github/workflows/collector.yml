name: V2Ray Config Collector

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'channels.json'
      - 'sources.json'
      - 'collector.py'
      - '.github/workflows/collector.yml'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  collect-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5  # ✅ ارتقاء به v5 برای Node.js 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v6  # ✅ ارتقاء به v6 برای Node.js 24
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        id: install_deps
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt not found, installing manually..."
            pip install requests beautifulsoup4 lxml
          fi
      
      - name: Create Default JSON Files If Missing
        id: create_json
        continue-on-error: true
        run: |
          if [ ! -f channels.json ]; then
            echo '{"channels": []}' > channels.json
            echo "📝 Created default channels.json"
          fi
          if [ ! -f sources.json ]; then
            echo '{"sources": []}' > sources.json
            echo "📝 Created default sources.json"
          fi
      
      - name: Run Collector Script
        id: collector
        continue-on-error: true
        run: |
          echo "🚀 Starting collector..."
          python collector.py
          EXIT_CODE=$?
          echo "Collector exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
      
      - name: Check for Changes
        id: check_changes
        if: always()
        continue-on-error: true
        run: |
          echo "🔍 Checking for changes..."
          git status
          if git status --porcelain | grep -q .; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "✅ تغییرات جدید یافت شد"
            git status --short
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "⚠️ هیچ تغییری یافت نشد"
          fi
      
      - name: Commit and Push Changes
        if: steps.check_changes.outputs.changes == 'true'
        continue-on-error: true
        run: |
          echo "📤 Committing and pushing changes..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🔄 Auto-update configs & MTProto proxies - $(date +'%Y-%m-%d %H:%M:%S UTC')"
          git push
          echo "✅ Changes pushed successfully"
      
      - name: Generate Summary
        if: always()
        continue-on-error: true
        run: |
          echo "## 📊 آمار آخرین اجرا" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| فایل | تعداد کانفیگ/پروکسی |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          
          for file in config.txt config_lite.txt mtproto.txt; do
            if [ -f "$file" ]; then
              count=$(wc -l < "$file" | tr -d ' ')
              echo "| $file | $count |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $file | 0 |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### پروتکل‌ها:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for proto in vmess vless trojan ss ssr tuic socks juicity reality hysteria hysteria2 ssh wireguard mtproto; do
            if [ -f "${proto}.txt" ]; then
              count=$(wc -l < "${proto}.txt" | tr -d ' ')
              echo "- **${proto}**: $count آیتم" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **زمان اجرا:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Collector Exit Code:** ${{ steps.collector.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
