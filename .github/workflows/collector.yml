name: V2Ray Config Collector

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'channels.json'
      - 'sources.json'
      - 'collector.py'
      - '.github/workflows/collector.yml'
      - 'update_readme.py'

permissions:
  contents: write

jobs:
  collect-configs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Collector Script
        run: python collector.py
      
      - name: Generate Dynamic README
        run: python update_readme.py
      
      - name: Check for Changes
        id: check_changes
        run: |
          if git status --porcelain | grep -q .; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "✅ تغییرات جدید یافت شد"
            git status --short
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "⚠️ هیچ تغییری یافت نشد"
          fi
      
      - name: Commit and Push Changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🔄 Auto-update configs and README - $(date +'%Y-%m-%d %H:%M:%S UTC')"
          git push
      
      - name: Generate Summary
        run: |
          echo "## 📊 آمار آخرین اجرا" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| فایل | تعداد کانفیگ |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          
          for file in config.txt config_lite.txt; do
            if [ -f "$file" ]; then
              count=$(wc -l < "$file")
              echo "| $file | $count |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### پروتکل‌ها:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for proto in vmess vless trojan ss ssr tuic socks juicity reality hysteria hysteria2 ssh wireguard; do
            if [ -f "${proto}.txt" ]; then
              count=$(wc -l < "${proto}.txt")
              echo "- **${proto}**: $count کانفیگ" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **زمان اجرا:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
